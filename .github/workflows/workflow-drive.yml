name: Workflow drive

# The harness dispatches this (ADR-0006, spec 07 §Driven runs): a `repository_dispatch`
# with `client_payload: { mode: run|resume, run_id, harness_url, workflow?, inputs? }`
# sent by the harness's `POST /api/workflow/run/drive` rule through CE's github_api
# handler. `run` starts a workflow headless with --wait park; `resume` picks a parked
# run back up. Both exit 0 on a park — the run is waiting on a person, not failed.
on:
  repository_dispatch:
    types: [workflow-drive]

concurrency: { group: "drive-${{ github.event.client_payload.run_id }}", cancel-in-progress: false }

permissions: { contents: read }

jobs:
  drive:
    runs-on: ubuntu-latest
    # Two legs of `--timeout 60m` plus grace: one job can park and be resumed in
    # the same run (--wait park returns, then the resume leg follows again), and
    # the runner's own kill must not be how that normally ends. Being killed is
    # recoverable — the lease lapses after 60 s and the run stays adoptable —
    # but it loses the leg's exit code, so the ceiling sits above both legs.
    timeout-minutes: 130
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g @bffless/workflow-headless@^1.3
      # The version the installed driver actually loaded, never a literal: the driver's
      # own pin is the only version whose browser revision it will run, and it moves
      # with `@^1.3` above. It keys the cache and the install both.
      - name: The Playwright the driver pins
        id: pw
        # A block scalar, not a plain one: the expression carries a `: ` and YAML would
        # refuse the line.
        run: |
          echo "version=$(node -p "require(require.resolve('playwright/package.json', { paths: ['$(npm root -g)/@bffless/workflow-headless'] })).version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--only-shell`, because the driver launches headless with no `channel` and so runs
      # the headless shell — the full Chrome for Testing build was downloaded and never
      # started. No `--with-deps`: every chromium library is already on the runner image,
      # and the apt half only added CJK/Thai font coverage to the milestone screenshots.
      # A cache hit makes the install a no-op.
      - run: npx --yes playwright@${{ steps.pw.outputs.version }} install --only-shell chromium
      # Through the environment, never interpolated into `run:` — a JSON body is shell source otherwise.
      - name: Write the kickoff inputs
        env:
          WORKFLOW_INPUTS: ${{ toJSON(github.event.client_payload.inputs) }}
        run: printf '%s' "$WORKFLOW_INPUTS" > inputs.json
      - name: Drive
        env:
          MODE: ${{ github.event.client_payload.mode }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          HARNESS_URL: ${{ github.event.client_payload.harness_url }}
          TARGET: ${{ github.event.client_payload.workflow }}
          # The one secret PER HARNESS (bffless/apps#588, CE ≥ 0.4.50): an app token for the
          # member the job runs as (Settings → App Tokens on the harness's admin), minted with
          # the scopes workflow:read workflow:run workflow:files auth:session. The driver
          # exchanges it for a session at the admin origin and sends it as Bearer on every
          # /api/workflow/* call. Repo secrets, never dispatch payload. No email/password.
          # An app token is bound to ONE instance, and this repo is dispatched by two harnesses
          # (deploy-*.yml publish to j5s and to workflow.bffless.dev), so the `run:` below picks
          # by `harness_url`:
          #   WORKFLOW_APP_TOKEN              — workflow.j5s.dev (admin.j5s.dev, project bffless/workflow)
          #   WORKFLOW_APP_TOKEN_BFFLESS_DEV  — workflow.bffless.dev (admin.bffless.dev, project bffless/workflow)
          # A missing per-harness token leaves WORKFLOW_APP_TOKEN empty and the driver refuses
          # to start (exit 2, no login) rather than driving with the wrong identity.
          WORKFLOW_APP_TOKEN: ${{ secrets.WORKFLOW_APP_TOKEN }}
          # The run's drive nonce (spec 11, D28): the harness claims the run for the requester at
          # run/drive and the driver presents this on every request the driven page makes.
          # Empty on a payload without one — the driver then installs no header.
          WORKFLOW_DRIVE_KEY: ${{ github.event.client_payload.drive_key }}
          WORKFLOW_APP_TOKEN_BFFLESS_DEV: ${{ secrets.WORKFLOW_APP_TOKEN_BFFLESS_DEV }}
        run: |
          case "$HARNESS_URL" in
            https://workflow.bffless.dev|https://workflow.bffless.dev/*)
              export WORKFLOW_APP_TOKEN="$WORKFLOW_APP_TOKEN_BFFLESS_DEV" ;;
          esac
          unset WORKFLOW_APP_TOKEN_BFFLESS_DEV
          if [ "$MODE" = "run" ]; then
            workflow-headless run "$HARNESS_URL" "$TARGET" --inputs inputs.json --run-id "$RUN_ID" --wait park --out output --timeout 60m
          else
            workflow-headless resume "$HARNESS_URL" "$RUN_ID" --out output --timeout 60m
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "workflow-drive-${{ github.event.client_payload.run_id }}", path: output/, if-no-files-found: warn }
